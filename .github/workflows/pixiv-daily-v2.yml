name: Pixiv daily auto update v2

on:
  schedule:
    - cron: "17 4 * * *" # 12:17 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Build
        run: mvn --batch-mode package
      - name: Update README
        run: java -jar target/hvv-pixiv-daily-jar-with-dependencies.jar
      - name: Publish current original images
        run: |
          snapshot_dir="$RUNNER_TEMP/daily-images-snapshot"
          worktree_dir="$RUNNER_TEMP/daily-images-worktree"
          mkdir -p "$snapshot_dir"
          cp -R daily-images/. "$snapshot_dir/"
          git worktree add --detach "$worktree_dir"
          git -C "$worktree_dir" checkout --orphan daily-images-snapshot
          git -C "$worktree_dir" rm -rf .
          mkdir -p "$worktree_dir/daily-images"
          cp -R "$snapshot_dir/." "$worktree_dir/daily-images/"
          touch "$worktree_dir/.nojekyll"
          git -C "$worktree_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree_dir" config user.name "github-actions[bot]"
          git -C "$worktree_dir" add .
          git -C "$worktree_dir" commit -m "Publish current Pixiv originals"
          git -C "$worktree_dir" push --force origin HEAD:daily-images
          git worktree remove "$worktree_dir"
      - name: Commit and push changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date"
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add README.md
          git commit -m "Update Pixiv daily rankings"
          git push
