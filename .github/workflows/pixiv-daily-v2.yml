name: Pixiv daily auto update v2

on:
  schedule:
    - cron: "*/5 * * * *" # Temporary repeated schedule test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Build
        run: mvn --batch-mode package
      - name: Update README
        run: java -jar target/hvv-pixiv-daily-jar-with-dependencies.jar
      - name: Commit and push changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date"
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add README.md
          git commit -m "Update Pixiv daily rankings"
          git push
